<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #06070b;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: #f2f3f6;
    position: relative;
    display: flex;
    align-items: center;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(50rem 34rem at 6% -10%, rgba(10,132,255,0.30), transparent 60%),
      radial-gradient(44rem 32rem at 92% 8%, rgba(191,90,242,0.24), transparent 58%),
      radial-gradient(46rem 34rem at 55% 112%, rgba(48,209,88,0.14), transparent 60%);
  }
  .left { position: relative; padding: 0 0 0 74px; width: 620px; }
  h1 { font-size: 68px; line-height: 1; letter-spacing: -0.035em; font-weight: 700; }
  .role {
    margin-top: 18px; font-size: 27px; font-weight: 550; letter-spacing: -0.02em;
    background: linear-gradient(100deg, #7fbcff, #bf5af2 58%, #64d2ff);
    -webkit-background-clip: text; color: transparent;
  }
  .desc { margin-top: 26px; font-size: 21px; line-height: 1.45; color: #a5abb8; }
  .desc b { color: #f2f3f6; font-weight: 600; }
  .url {
    margin-top: 34px; display: inline-block;
    font-size: 19px; font-weight: 600; letter-spacing: 0.01em;
    color: #fff; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    padding: 10px 20px; border-radius: 999px;
  }

  .right { position: relative; flex: 1; height: 100%; }
  .phone {
    position: absolute; width: 232px; height: 502px;
    border-radius: 40px; padding: 6px;
    background: linear-gradient(160deg, #2a2d36, #101218 55%, #23262e);
    box-shadow: 0 30px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; border-radius: 34px; display: block; }
  .p1 { top: 44px;  left: 6px;   transform: rotate(-6deg); }
  .p2 { top: 96px;  left: 190px; transform: rotate(-2deg); z-index: 2; }
  .p3 { top: 150px; left: 374px; transform: rotate(3deg); }
</style>
</head>
<body>
  <div class="left">
    <h1>Lauro Marinho</h1>
    <div class="role">iOS Developer</div>
    <div class="desc">
      Native iOS apps, end to end.<br>
      <b>Swift · SwiftUI · watchOS · AVFoundation</b>
    </div>
    <div class="url">lauromarinho.github.io</div>
  </div>
  <div class="right">
    <div class="phone p1"><img src="assets/screens/artistlab-1.jpg"></div>
    <div class="phone p2"><img src="assets/screens/mymood-1.jpg"></div>
    <div class="phone p3"><img src="assets/screens/storeflow-1.jpg"></div>
  </div>
</body>
</html>
